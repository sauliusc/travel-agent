<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelionių planuotojas</title>
<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e2229; --border: #2a2f3a;
    --text: #e6e8eb; --text-dim: #9aa1ad; --accent: #3a8c7c; --accent-2: #7ad0be;
    --err: #e6807a; --err-bg: rgba(224,92,92,0.14); --ok: #5fc491; --warn: #e0b25a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden;
  }

  #sidebar { width: 320px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  #sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }
  #sidebar-header h1 { font-size: 16px; margin: 0 0 12px; font-weight: 600; }
  #new-trip-btn { width: 100%; padding: 10px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 600; }
  #new-trip-btn:hover { background: var(--accent-2); }

  #trip-list { flex: 1; overflow-y: auto; padding: 8px; }
  .empty-list { padding: 16px; color: var(--text-dim); font-size: 13px; }
  .trip-item { padding: 12px; border-radius: 8px; margin-bottom: 6px; cursor: pointer; border: 1px solid transparent; }
  .trip-item:hover { background: var(--panel-2); }
  .trip-item.active { background: var(--panel-2); border-color: var(--accent); }
  .trip-item .title { font-size: 13px; line-height: 1.4; color: var(--text); margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .trip-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
  .badge.queued { background: rgba(154,161,173,0.15); color: var(--text-dim); }
  .badge.running { background: rgba(224,178,90,0.15); color: var(--warn); }
  .badge.done { background: rgba(95,196,145,0.15); color: var(--ok); }
  .badge.failed { background: var(--err-bg); color: var(--err); }
  .trip-time { font-size: 11px; color: var(--text-dim); }

  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
  #empty-state { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-size: 14px; }

  #composer { flex: 1; overflow-y: auto; padding: 32px 24px; }
  #composer .inner { max-width: 640px; margin: 0 auto; }
  #composer h2 { margin-top: 0; }
  #composer p { color: var(--text-dim); font-size: 14px; }
  textarea { width: 100%; min-height: 160px; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); font-size: 14px; font-family: inherit; resize: vertical; }
  button.primary { margin-top: 12px; padding: 10px 22px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  button.primary:hover { background: var(--accent-2); }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }

  #detail { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
  #detail-header { padding: 18px 24px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  #detail-header .req-text { font-size: 14px; color: var(--text-dim); white-space: pre-wrap; margin: 10px 0; max-height: 120px; overflow-y: auto; line-height: 1.5; }
  .action-row { display: flex; gap: 8px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
  .btn { padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); font-size: 13px; cursor: pointer; text-decoration: none; display: inline-block; }
  .btn:hover { border-color: var(--accent); }
  .btn.danger:hover { border-color: var(--err); color: var(--err); }
  .btn.link { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.link:hover { background: var(--accent-2); border-color: var(--accent-2); }

  .stages-panel { margin-top: 12px; }
  .stages-panel .stages-label { font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  .stage-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .stage-chip { padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text-dim); font-size: 12px; cursor: pointer; }
  .stage-chip:hover { border-color: var(--accent); color: var(--text); }
  .stage-chip:disabled { opacity: 0.4; cursor: not-allowed; }

  .modify-box { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .modify-box .modify-label { font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  .modify-row { display: flex; gap: 8px; }
  .modify-row input[type=text] { flex: 1; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); font-size: 13px; font-family: inherit; }
  .modify-row button { flex-shrink: 0; }

  #log { flex: 1; overflow-y: auto; padding: 16px 24px; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 13px; line-height: 1.7; background: #0b0d11; }
  .log-line { padding: 2px 0; white-space: pre-wrap; word-break: break-word; }
  .log-line.error { color: var(--err); }
  .log-line.ok-final { color: var(--ok); font-weight: 600; }

  [hidden] { display: none !important; }

  @media (max-width: 700px) {
    body { flex-direction: column; height: auto; min-height: 100vh; }
    #sidebar { width: 100%; height: 38vh; border-right: none; border-bottom: 1px solid var(--border); }
    #main { min-height: 62vh; }
  }
</style>
</head>
<body>
  <aside id="sidebar">
    <div id="sidebar-header">
      <h1>🧭 Kelionių planuotojas</h1>
      <button id="new-trip-btn" onclick="showComposer()">+ Nauja kelionė</button>
    </div>
    <div id="trip-list" hx-get="/trips/list" hx-trigger="load, every 5s" hx-swap="innerHTML"></div>
  </aside>

  <main id="main">
    <div id="empty-state">Pasirink kelionę kairėje arba pradėk naują.</div>

    <div id="composer" hidden>
      <div class="inner">
        <h2>Nauja kelionė</h2>
        <p>Įklijuok kelionės reikalavimus laisvu tekstu — datas, kryptį, keliautojų skaičių, prioritetus.</p>
        <textarea id="requirements-input" placeholder="Albanija, 3 dienos, spalio 2-4, 2 žmonės, automobilis, gamtos objektai..."></textarea>
        <br>
        <button class="primary" id="submit-btn" onclick="submitTrip()">Planuoti</button>
      </div>
    </div>

    <div id="detail" hidden>
      <div id="detail-header">
        <div class="trip-row">
          <span id="detail-badge" class="badge"></span>
          <span id="detail-time" class="trip-time"></span>
        </div>
        <div id="detail-req" class="req-text"></div>
        <div class="action-row" id="detail-actions"></div>
        <div id="detail-stages"></div>
        <div id="detail-modify"></div>
      </div>
      <div id="log"></div>
    </div>
  </main>

<script>
const STATUS_LABELS = { queued: 'Laukia', running: 'Vykdoma', done: 'Baigta', failed: 'Nepavyko' };
const STAGE_LABELS = {
  requirements: 'Reikalavimai', research: 'Tyrimas', weather: 'Oras/sezonas',
  accommodation: 'Nakvynė', itinerary: 'Dienų planas', logistics_report: 'Logistika',
  map_data: 'Žemėlapis', images: 'Nuotraukos', budget: 'Biudžetas',
  page: 'Puslapis', deploy_log: 'Publikavimas',
};
let currentTripId = null;
let currentEventSource = null;

function fmtTime(iso) {
  if (!iso) return '';
  return iso.replace('T', ' ').slice(0, 16);
}

function markActiveInSidebar() {
  document.querySelectorAll('#trip-list .trip-item').forEach(el => {
    el.classList.toggle('active', el.dataset.tripId === currentTripId);
  });
}
// Re-apply the active highlight after every HTMX-driven sidebar refresh,
// since /trips/list is a stateless fragment that doesn't know which trip
// the viewer currently has open.
document.body.addEventListener('htmx:afterSwap', (e) => {
  if (e.detail.target && e.detail.target.id === 'trip-list') markActiveInSidebar();
});

function showComposer() {
  currentTripId = null;
  if (currentEventSource) { currentEventSource.close(); currentEventSource = null; }
  document.getElementById('empty-state').hidden = true;
  document.getElementById('detail').hidden = true;
  document.getElementById('composer').hidden = false;
  document.getElementById('requirements-input').value = '';
  document.getElementById('requirements-input').focus();
  markActiveInSidebar();
}

async function submitTrip() {
  const input = document.getElementById('requirements-input');
  const text = input.value.trim();
  if (!text) return;
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'Siunčiama...';
  try {
    const res = await fetch('/trips', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'requirements_text=' + encodeURIComponent(text),
    });
    const { trip_id } = await res.json();
    htmx.trigger('#trip-list', 'load');
    openTrip(trip_id);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Planuoti';
  }
}

async function openTrip(tripId) {
  currentTripId = tripId;
  if (currentEventSource) { currentEventSource.close(); currentEventSource = null; }

  document.getElementById('empty-state').hidden = true;
  document.getElementById('composer').hidden = true;
  document.getElementById('detail').hidden = false;
  markActiveInSidebar();

  const res = await fetch('/trips/' + tripId);
  if (!res.ok) { showComposer(); return; }
  const trip = await res.json();

  renderDetailHeader(trip);
  const logEl = document.getElementById('log');
  logEl.innerHTML = '';
  trip.events.forEach(ev => appendLogLine(ev.message, ev.level));

  if (trip.status === 'running' || trip.status === 'queued') {
    streamLive(tripId);
  }
}

function renderDetailHeader(trip) {
  const badge = document.getElementById('detail-badge');
  badge.className = 'badge ' + trip.status;
  badge.textContent = STATUS_LABELS[trip.status] || trip.status;
  document.getElementById('detail-time').textContent =
    fmtTime(trip.created_at) + (trip.finished_at ? ' → ' + fmtTime(trip.finished_at) : '');
  document.getElementById('detail-req').textContent = trip.requirements_text;

  const actions = document.getElementById('detail-actions');
  let out = '';
  if (trip.status === 'done' && trip.page_url && trip.page_url.startsWith('http')) {
    out += `<a class="btn link" href="${trip.page_url}" target="_blank" rel="noopener">Atidaryti puslapį ↗</a>`;
  }
  if (trip.status === 'failed') {
    out += `<button class="btn" onclick="retryTrip('${trip.id}')">↻ Bandyti dar kartą</button>`;
  }
  out += `<button class="btn danger" onclick="deleteTrip('${trip.id}')">🗑 Ištrinti</button>`;
  actions.innerHTML = out;

  renderStagePanel(trip);
  renderModifyBox(trip);
}

function renderStagePanel(trip) {
  const panel = document.getElementById('detail-stages');
  const stages = trip.completed_stages || [];
  const busy = trip.status === 'running' || trip.status === 'queued';
  if (!stages.length) { panel.innerHTML = ''; return; }
  const chips = stages.map(s =>
    `<button class="stage-chip" ${busy ? 'disabled' : ''} onclick="rerunFromStage('${trip.id}', '${s}')" `
    + `title="Perleisti pipeline nuo šio žingsnio, naudojant išsaugotus ankstesnių žingsnių rezultatus">`
    + `↻ ${STAGE_LABELS[s] || s}</button>`
  ).join('');
  panel.innerHTML = `<div class="stages-panel"><div class="stages-label">Perleisti nuo žingsnio:</div>`
    + `<div class="stage-chips">${chips}</div></div>`;
}

function renderModifyBox(trip) {
  const box = document.getElementById('detail-modify');
  const stages = trip.completed_stages || [];
  const busy = trip.status === 'running' || trip.status === 'queued';
  if (!stages.includes('itinerary')) { box.innerHTML = ''; return; }
  box.innerHTML = `<div class="modify-box"><div class="modify-label">Pataisyti kelionę (laisvas tekstas):</div>`
    + `<div class="modify-row">`
    + `<input type="text" id="modify-input" placeholder="pvz. pridėti papildomą pajūrio dieną" ${busy ? 'disabled' : ''}>`
    + `<button class="btn" ${busy ? 'disabled' : ''} onclick="modifyTrip('${trip.id}')">Pataisyti</button>`
    + `</div></div>`;
}

function appendLogLine(message, level) {
  const logEl = document.getElementById('log');
  const div = document.createElement('div');
  const isError = level === 'error';
  div.className = 'log-line' + (isError ? ' error' : '') + (message === 'Baigta.' ? ' ok-final' : '');
  div.textContent = message;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

function streamLive(tripId) {
  const es = new EventSource('/trips/' + tripId + '/events');
  currentEventSource = es;
  es.onmessage = (e) => {
    const isError = e.data.startsWith('Klaida:') || e.data.startsWith('Nepavyko:');
    appendLogLine(e.data, isError ? 'error' : 'info');
    if (e.data === 'Baigta.' || isError) {
      fetch('/trips/' + tripId).then(r => r.json()).then(renderDetailHeader);
      htmx.trigger('#trip-list', 'load');
    }
  };
  es.onerror = () => { es.close(); if (currentEventSource === es) currentEventSource = null; };
}

async function retryTrip(tripId) {
  const res = await fetch('/trips/' + tripId + '/retry', { method: 'POST' });
  if (!res.ok) return;
  const { trip_id } = await res.json();
  htmx.trigger('#trip-list', 'load');
  openTrip(trip_id);
}

async function rerunFromStage(tripId, stage) {
  const res = await fetch('/trips/' + tripId + '/rerun-from/' + encodeURIComponent(stage), { method: 'POST' });
  if (!res.ok) { appendLogLine('Nepavyko paleisti iš naujo: ' + (await res.text()), 'error'); return; }
  htmx.trigger('#trip-list', 'load');
  openTrip(tripId);
}

async function modifyTrip(tripId) {
  const input = document.getElementById('modify-input');
  const text = input.value.trim();
  if (!text) return;
  const res = await fetch('/trips/' + tripId + '/modify', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'modification=' + encodeURIComponent(text),
  });
  if (!res.ok) { appendLogLine('Nepavyko pataisyti: ' + (await res.text()), 'error'); return; }
  htmx.trigger('#trip-list', 'load');
  openTrip(tripId);
}

async function deleteTrip(tripId) {
  if (!confirm('Ištrinti šią kelionę iš istorijos?')) return;
  await fetch('/trips/' + tripId, { method: 'DELETE' });
  htmx.trigger('#trip-list', 'load');
  if (currentTripId === tripId) showComposer();
}
</script>
</body>
</html>
