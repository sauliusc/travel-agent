<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nustatymai</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e2229; --border: #2a2f3a;
    --text: #e6e8eb; --text-dim: #9aa1ad; --accent: #3a8c7c; --accent-2: #7ad0be;
    --err: #e6807a; --err-bg: rgba(224,92,92,0.14); --ok: #5fc491;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; gap: 16px; }
  header h1 { margin: 0; font-size: 17px; }
  header a { color: var(--accent-2); text-decoration: none; font-size: 14px; }
  .layout { display: flex; max-width: 1400px; margin: 0 auto; }
  nav#settings-nav { width: 220px; flex-shrink: 0; padding: 16px 12px; position: sticky; top: 53px; align-self: flex-start; }
  nav#settings-nav a { display: block; padding: 8px 12px; border-radius: 8px; color: var(--text-dim); text-decoration: none; font-size: 14px; margin-bottom: 2px; }
  nav#settings-nav a:hover { background: var(--panel); color: var(--text); }
  nav#settings-nav a.active { background: var(--panel-2); color: var(--text); box-shadow: inset 3px 0 0 var(--accent); }
  main { flex: 1; min-width: 0; padding: 16px 24px 40px; }
  main > h2.section-title { margin: 0 0 6px; font-size: 20px; }
  .intro { color: var(--text-dim); font-size: 13px; margin: 0 0 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .agent { text-align: left; font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; cursor: pointer; }
  .agent:hover { border-color: var(--accent); }
  .agent.active { border-color: var(--accent); background: var(--panel-2); }
  .agent .name { font-weight: 600; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
  .agent .count { color: var(--text-dim); font-size: 11px; font-weight: 400; white-space: nowrap; }
  .agent .model { margin-top: 6px; font-size: 12px; color: var(--accent-2); font-family: ui-monospace, Consolas, monospace; }
  .agent .model.none { color: var(--text-dim); font-family: inherit; }
  #detail { margin-top: 20px; }
  .card { margin-top: 14px; padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); }
  .card h2 { margin: 0 0 4px; font-size: 18px; }
  .card h3 { margin: 0 0 10px; font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em; }
  .desc { color: var(--text-dim); font-size: 13px; line-height: 1.5; margin: 0 0 12px; }
  dl { display: grid; grid-template-columns: 170px 1fr; gap: 6px 12px; margin: 0; font-size: 13px; }
  dt { color: var(--text-dim); }
  dd { margin: 0; word-break: break-word; }
  .chip { display: inline-block; padding: 1px 8px; margin: 0 4px 4px 0; border-radius: 999px; font-size: 12px; background: var(--panel-2); border: 1px solid var(--border); font-family: ui-monospace, Consolas, monospace; }
  .chip.deny { color: var(--err); border-color: rgba(230,128,122,.35); }
  .chip.model { color: var(--accent-2); border-color: var(--accent); }
  details > summary { cursor: pointer; font-size: 13px; color: var(--text-dim); padding: 4px 0; }
  details > summary:hover { color: var(--text); }
  pre { margin: 6px 0 0; padding: 10px; background: #0b0d11; border: 1px solid var(--border); border-radius: 6px; white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, Consolas, monospace; font-size: 12px; line-height: 1.55; max-height: 60vh; overflow: auto; }
  .call { border-top: 1px solid var(--border); padding: 12px 0; }
  .call:first-of-type { border-top: none; padding-top: 0; }
  .call-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  .call-head a { color: var(--accent-2); }
  .st { font-weight: 600; }
  .st.ok { color: var(--ok); } .st.err { color: var(--err); }
  code { white-space: nowrap; }
  .empty { color: var(--text-dim); font-size: 13px; }
  @media (max-width: 700px) {
    header, main { padding-left: 16px; padding-right: 16px; }
    .layout { display: block; }
    nav#settings-nav { width: auto; position: static; display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px 0; }
    nav#settings-nav a { white-space: nowrap; margin: 0; }
    dl { grid-template-columns: 1fr; }
    dt { margin-top: 6px; }
  }
</style>
</head>
<body>
<header>
  <a href="/">← Kelionės</a>
  <h1>⚙️ Nustatymai</h1>
</header>
<div class="layout">
  <nav id="settings-nav" aria-label="Nustatymų skyriai"></nav>
  <main id="settings-content"></main>
</div>
<script>
let agents = [];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = iso => iso ? iso.replace('T', ' ').slice(0, 16) : '–';
const modelText = m => (m && m.models && m.models.length) ? m.models.join(', ') : null;
const chips = (list, cls = '') => (list && list.length) ? list.map(t => `<span class="chip ${cls}">${esc(t)}</span>`).join('') : '<span class="empty">–</span>';

// Settings sections. To add one: append {id, label, title, render(container, sub)}
// -- the nav, URL hash (#<id>/<sub>) and back/forward all follow automatically.
const SECTIONS = [
  { id: 'agents', label: '🤖 Agentai', title: 'Agentai', render: renderAgents },
];

function route() {
  const [id, sub] = decodeURIComponent(location.hash.slice(1)).split('/');
  const section = SECTIONS.find(s => s.id === id) || SECTIONS[0];
  document.querySelectorAll('#settings-nav a').forEach(a => a.classList.toggle('active', a.dataset.id === section.id));
  document.title = section.title + ' · Nustatymai';
  const main = document.getElementById('settings-content');
  main.innerHTML = `<h2 class="section-title">${esc(section.title)}</h2>`;
  const box = document.createElement('div');
  main.appendChild(box);
  section.render(box, sub);
}

document.getElementById('settings-nav').innerHTML =
  SECTIONS.map(s => `<a href="#${s.id}" data-id="${s.id}">${esc(s.label)}</a>`).join('');
window.addEventListener('hashchange', route);

async function renderAgents(box, sub) {
  box.innerHTML = `<p class="intro">Kiekvienas agentas – atskiras <code>claude -p</code> kvietimas. Modelis ir nustatymai rodomi iš paskutinio tikro kvietimo; užduotis – tai, kas agentui buvo nusiųsta.</p>
    <div class="grid" id="agents"></div><div id="detail"></div>`;
  agents = await (await fetch('/api/agents')).json();
  document.getElementById('agents').innerHTML = agents.map(a => {
    const model = modelText(a.meta);
    return `<button class="agent" data-stage="${a.stage}" onclick="openAgent('${a.stage}')">
      <div class="name">${esc(a.label)}<span class="count">${a.count} kviet.</span></div>
      <div class="model ${model ? '' : 'none'}">${model ? esc(model) : (a.count ? 'modelis nežinomas (seni įrašai)' : 'dar nekviestas')}</div>
    </button>`;
  }).join('');
  if (sub && agents.some(a => a.stage === sub)) showAgent(sub);
}

function openAgent(stage) { location.hash = 'agents/' + stage; }

async function showAgent(stage) {
  document.querySelectorAll('.agent').forEach(b => b.classList.toggle('active', b.dataset.stage === stage));
  const a = agents.find(x => x.stage === stage);
  const m = a.meta;
  const detail = document.getElementById('detail');
  detail.innerHTML = `
    <section class="card">
      <h2>${esc(a.label)}</h2>
      <p class="desc">${esc(a.description)}</p>
      <dl>
        <dt>AI modelis</dt><dd>${m && modelText(m) ? chips(m.models, 'model') : `<span class="empty">${a.count ? 'nežinomas – įrašai iš prieš atnaujinimą' : 'dar nekviestas'}</span>`}${m && m.model_flag ? ` <span class="empty">(--model ${esc(m.model_flag)})</span>` : (m ? ' <span class="empty">(CLI numatytasis)</span>' : '')}</dd>
        <dt>Kodas</dt><dd><code>${esc(a.module)}</code></dd>
        <dt>Sistemos promptas</dt><dd><code>prompts/${esc(a.prompt_file || '–')}</code></dd>
        <dt>Leidžiami įrankiai</dt><dd>${m ? chips(m.allowed_tools) : '–'}</dd>
        <dt>Uždrausti įrankiai</dt><dd>${m ? chips(m.disallowed_tools, 'deny') : '–'}</dd>
        <dt>Atsakymo schema</dt><dd>${m && m.schema ? `<span class="chip">${esc(m.schema)}</span>` : 'laisvas tekstas'}</dd>
        <dt>Leidimų režimas / limitas</dt><dd>${m ? `${esc(m.permission_mode)} · ${m.timeout} s` : '–'}</dd>
        <dt>Paskutinis kvietimas</dt><dd>${fmt(a.last_at)} · iš viso ${a.count}</dd>
      </dl>
      <details style="margin-top:12px"><summary>Sistemos prompto tekstas</summary><pre>${esc(a.prompt)}</pre></details>
    </section>
    <section class="card"><h3>Paskutinės užduotys</h3><div id="calls" class="empty">Kraunama...</div></section>`;
  const calls = await (await fetch(`/api/agents/${encodeURIComponent(stage)}/calls?limit=20`)).json();
  const box = document.getElementById('calls');
  if (!calls.length) { box.textContent = 'Šis agentas dar nebuvo kviestas.'; return; }
  box.className = '';
  box.innerHTML = calls.map(c => {
    const cm = c.meta;
    const input = cm ? cm.user_input : (c.query.split('[user input]\n')[1] || c.query).split('\n\n[cli]')[0];
    const status = cm ? (cm.ok ? '<span class="st ok">✓ pavyko</span>' : '<span class="st err">✗ klaida</span>')
                      : (c.response.startsWith('ERROR') ? '<span class="st err">✗ klaida</span>' : '');
    return `<div class="call">
      <div class="call-head">
        <span>${fmt(c.created_at)}</span>${status}
        ${cm && modelText(cm) ? `<span class="chip model">${esc(modelText(cm))}</span>` : ''}
        ${cm ? `<span>${cm.duration_s} s</span>` : ''}${cm && cm.num_turns ? `<span>${cm.num_turns} ėjim.</span>` : ''}
        <a href="/#${esc(c.trip_id)}" title="${esc(c.trip)}">kelionė ${esc(c.trip_id)}</a>
      </div>
      <details open><summary>Užduotis agentui</summary><pre>${esc(input)}</pre></details>
      <details><summary>Atsakymas</summary><pre>${esc(c.response)}</pre></details>
      <details><summary>Visa užklausa (su sistemos promptu ir CLI parametrais)</summary><pre>${esc(c.query)}</pre></details>
    </div>`;
  }).join('');
}

route();
</script>
</body>
</html>
